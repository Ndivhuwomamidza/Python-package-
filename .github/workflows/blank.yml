The Problem
You ran GitHub's default placeholder workflow (the "Hello, world!" template), not the PyPI upload workflow!
Because that file only ran echo Hello, world!, it never:
Built your Python wheel or source distribution (python -m build).
Uploaded anything to PyPI (pypa/gh-action-pypi-publish).
That is why PyPI is still waiting on "Pending publisher"—no package was ever sent to it!
How to Fix It (Step-by-Step)
Step 1: Open Your Workflow File on GitHub
In your repository (Ndivhuwomamidza/Python-package-), go to:
.github/workflows/
Click on the .yml file that is in that folder (it might be named blank.yml, main.yml, or ci.yml).
Click the Pencil ✏️ (Edit) icon.
Step 2: Replace Everything with This Exact Code
Delete everything in that file and paste this:
code
Yaml
name: Upload Python Package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
